    var view = narrow ? 'stack' : state.view;
    var cs = getComputedStyle(stage);
    var avail = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var fit = view === 'side' ? (avail - 32) / 2 / PAGE_W : avail / PAGE_W;
    fit = Math.min(fit, view === 'side' ? 1.15 : 1.35);
    var s = fit * state.zoom;
    pages.style.setProperty('--s', s.toFixed(4));
    stage.dataset.view = view;
    bSide.setAttribute('aria-pressed', String(view === 'side'));
    bStack.setAttribute('aria-pressed', String(view === 'stack'));
    bSide.disabled = narrow;
    pct.textContent = Math.round(s * 100) + '%';
  }

  bSide.addEventListener('click', function () { state.view = 'side'; save(); layout(); });
  bStack.addEventListener('click', function () { state.view = 'stack'; save(); layout(); });
  document.getElementById('z-in').addEventListener('click', function () { state.zoom = Math.min(2, +(state.zoom + 0.15).toFixed(2)); save(); layout(); });
  document.getElementById('z-out').addEventListener('click', function () { state.zoom = Math.max(0.6, +(state.zoom - 0.15).toFixed(2)); save(); layout(); });
  pct.addEventListener('click', function () { state.zoom = 1; save(); layout(); });
  window.addEventListener('resize', layout);

  document.getElementById('print-all').addEventListener('click', function () { window.print(); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-print]'), function (b) {
    b.addEventListener('click', function () { document.body.setAttribute('data-print', b.getAttribute('data-print')); window.print(); });
  });
  window.addEventListener('afterprint', function () { document.body.removeAttribute('data-print'); });

  layout();
})();
</script>
</body>
</html>
