      <stop offset="0" stop-color="#0E7C7B"/>
      <stop offset="1" stop-color="#0D1B2A"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0D1B2A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="4" y="3" width="312" height="62" rx="31" fill="url(#bg)" filter="url(#sh)"/>
  <rect x="4.75" y="3.75" width="310.5" height="60.5" rx="30.25" fill="none" stroke="#2DD4BF" stroke-opacity="0.55" stroke-width="1.5"/>

  <clipPath id="shine"><rect x="4" y="3" width="312" height="62" rx="31"/></clipPath>
  <g clip-path="url(#shine)"><rect x="-70" y="-8" width="34" height="90" fill="#fff" fill-opacity="0.17" transform="skewX(-20)"><animate attributeName="x" values="-70;370;370" keyTimes="0;0.4;1" dur="5s" begin="1.2s" repeatCount="indefinite"/></rect></g>

