  <g fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32.5 24.5h9.5l6.5 6.5v13.5a2 2 0 0 1-2 2h-14a2 2 0 0 1-2-2v-18a2 2 0 0 1 2-2z"/>
