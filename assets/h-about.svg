<svg xmlns="http://www.w3.org/2000/svg" width="880" height="64" viewBox="0 0 880 64" role="img" aria-label="About me">
<title>About me</title>
<defs><style>
text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace}
:root{--b1:#FFFFFF;--b2:#E9F4F4}
.bg1{stop-color:#FFFFFF}.bg2{stop-color:#E6F3F3}
.s1{stop-color:#0E7C7B}.s2{stop-color:#7FB9C9}
.glow{stop-color:#0E7C7B;stop-opacity:.20}.glow0{stop-color:#0E7C7B;stop-opacity:0}
.t1{fill:#0D1B2A}.t2{fill:#4A5B6B}.t3{fill:#7A8A99}
.ac{fill:#0E7C7B}.acs{stroke:#0E7C7B}
.chip{fill:#0E7C7B;fill-opacity:.10;stroke:#0E7C7B;stroke-opacity:.38;stroke-width:1}
.chipt{fill:#0B5E5D}
.pnl{fill:#0E7C7B;fill-opacity:.05;stroke:#0E7C7B;stroke-opacity:.18;stroke-width:1}
.dotg{fill:#0E7C7B;fill-opacity:.16}
.sep{stroke:#0E7C7B;stroke-opacity:.2;stroke-width:1}
@media (prefers-color-scheme:dark){
.bg1{stop-color:#111C2A}.bg2{stop-color:#0A121C}
.s1{stop-color:#2DD4BF}.s2{stop-color:#3B6FA0}
.glow{stop-color:#2DD4BF;stop-opacity:.16}.glow0{stop-color:#2DD4BF;stop-opacity:0}
.t1{fill:#EAF2F8}.t2{fill:#A9B7C4}.t3{fill:#6F8091}
.ac{fill:#2DD4BF}.acs{stroke:#2DD4BF}
.chip{fill:#2DD4BF;fill-opacity:.10;stroke:#2DD4BF;stroke-opacity:.40}
.chipt{fill:#7EE8D8}
.pnl{fill:#2DD4BF;fill-opacity:.045;stroke:#2DD4BF;stroke-opacity:.16}
.dotg{fill:#2DD4BF;fill-opacity:.14}
.sep{stroke:#2DD4BF;stroke-opacity:.18}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="bg1"/><stop offset="1" class="bg2"/></linearGradient>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="s1"/><stop offset="1" class="s2"/></linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" class="s1"/><stop offset="1" class="s1" stop-opacity="0"/></linearGradient>
<radialGradient id="gl" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox" fx="0" fy="0"><stop offset="0" class="glow"/><stop offset="1" class="glow0"/></radialGradient>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" class="dotg"/></pattern></defs>
<circle cx="34" cy="32" r="20" class="chip"/><g transform="translate(22 20) scale(1.0)" fill="none" class="acs" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></g>
<text x="66" y="27" font-size="11.5" font-weight="600" letter-spacing="2.6" class="ac mono">01 / ABOUT ME</text>
<text x="66" y="51" font-size="22" font-weight="800" class="t1">About me</text>
<rect x="196" y="38" width="678" height="2" rx="1" fill="url(#ln)"/>
<circle cx="196" cy="39" r="4" class="ac pulse"/>
</svg>