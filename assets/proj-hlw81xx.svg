<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-label="STM32-HLW81xx: HLW8110/HLW8112 power-metering driver for STM32 HAL and FreeRTOS" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>STM32-HLW81xx</title>
  <defs>
    <clipPath id="card"><rect x="1" y="1" width="638" height="318" rx="24"/></clipPath>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A6BFA"/>
      <stop offset="1" stop-color="#31217A"/>
    </linearGradient>
    <linearGradient id="pNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A4470"/><stop offset="1" stop-color="#132240"/>
    </linearGradient>
    <linearGradient id="pBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8FD6"/><stop offset="1" stop-color="#2F5F9E"/>
    </linearGradient>
    <linearGradient id="pViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9A7BFA"/><stop offset="1" stop-color="#6A47E0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <!-- body -->
    <rect x="0" y="0" width="640" height="320" fill="#F6F8FB"/>
    <!-- header -->
    <rect x="0" y="0" width="640" height="128" fill="url(#hdr)"/>

    <!-- faint watermark: lightning bolt + mains wave -->
    <g opacity="0.16" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M520 14 L470 80 H505 L488 128 L548 58 H512 Z" fill="#FFFFFF" stroke="none"/>
      <path d="M440 96 C 470 44, 500 44, 530 96 S 590 148, 620 96"/>
    </g>

    <!-- title + subtitle pill -->
    <text x="32" y="56" font-family="'Inter','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="29" font-weight="700" fill="#FFFFFF">STM32-HLW81xx</text>
    <rect x="32" y="72" width="176" height="31" rx="15.5" fill="#FFFFFF" fill-opacity="0.2"/>
    <text x="120" y="93" text-anchor="middle" font-family="'Inter','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Power metering IC</text>

    <!-- open-link badge -->
    <circle cx="602" cy="42" r="23" fill="#FFFFFF" fill-opacity="0.22"/>
    <path d="M592 52 L612 32 M599 32 H612 V45" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- description -->
    <g font-family="'Inter','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19.5" fill="#5B6676">
      <text x="32" y="171">HLW8110/HLW8112 power-meter driver — V, I, P, PF</text>
      <text x="32" y="199">and frequency over UART. Interrupt-driven RX,</text>
      <text x="32" y="227">multi-chip support, auto-recovery, Doxygen docs</text>
    </g>

    <!-- tags -->
    <g font-family="'Inter','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF">
      <!-- STM32 HAL (chip icon) -->
      <rect x="32" y="254" width="150" height="36" rx="18" fill="url(#pNavy)"/>
      <g transform="translate(48 263)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
        <rect x="3" y="3" width="12" height="12" rx="2"/>
        <path d="M6 0V3 M12 0V3 M6 15V18 M12 15V18 M0 6H3 M0 12H3 M15 6H18 M15 12H18"/>
      </g>
      <text x="76" y="277">STM32 HAL</text>

      <!-- FreeRTOS (clock icon) -->
      <rect x="192" y="254" width="146" height="36" rx="18" fill="url(#pBlue)"/>
      <g transform="translate(208 263)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
        <circle cx="9" cy="9" r="8"/><path d="M9 4.5V9L12.5 11"/>
      </g>
      <text x="236" y="277">FreeRTOS</text>

      <!-- UART (arrows icon) -->
      <rect x="348" y="254" width="112" height="36" rx="18" fill="url(#pViolet)"/>
      <g transform="translate(364 263)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 6H16 M12 2L16 6L12 10 M16 13H2 M6 9L2 13L6 17"/>
      </g>
      <text x="392" y="277">UART</text>
    </g>
  </g>

  <!-- border -->
  <rect x="1" y="1" width="638" height="318" rx="24" fill="none" stroke="#D5DCE5" stroke-width="2"/>
</svg>
