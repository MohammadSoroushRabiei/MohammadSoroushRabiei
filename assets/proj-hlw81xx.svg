<svg xmlns="http://www.w3.org/2000/svg" width="480" height="210" viewBox="0 0 480 210" role="img" aria-label="STM32-HLW81xx: HLW8110/HLW8112 power-metering driver for STM32 HAL and FreeRTOS" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>STM32-HLW81xx</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1B2A"/>
      <stop offset="1" stop-color="#10303B"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E7C7B" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2DD4BF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0E7C7B" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="478" height="208" rx="14" fill="url(#bg)" stroke="#0E7C7B" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- decorative mains waveform (voltage + shifted current) -->
  <path d="M20 128 C 60 78, 100 78, 140 128 S 220 178, 260 128 S 340 78, 380 128 S 440 178, 460 150"
        fill="none" stroke="url(#wave)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M20 140 C 52 108, 84 108, 116 140 S 180 172, 212 140 S 276 108, 308 140 S 372 172, 404 140 S 450 120, 460 124"
        fill="none" stroke="#2DD4BF" stroke-opacity="0.28" stroke-width="1.6" stroke-linecap="round"/>

  <!-- label pill -->
  <rect x="24" y="22" width="132" height="22" rx="11" fill="#0E7C7B" fill-opacity="0.22" stroke="#2DD4BF" stroke-opacity="0.5"/>
  <text x="90" y="37.5" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="11" font-weight="600" fill="#2DD4BF" letter-spacing="1">POWER METER IC</text>

  <!-- title -->
  <text x="24" y="78" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="28" font-weight="700" fill="#E6F1F5">STM32-HLW81xx</text>
  <text x="24" y="102" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#9FB4C4">HLW8110 / HLW8112 UART driver · V · I · P · PF · Hz</text>

  <!-- tags -->
  <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="11" font-weight="600" fill="#CFE8E6">
    <rect x="24"  y="168" width="82" height="24" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#2DD4BF" stroke-opacity="0.35"/>
    <text x="65"  y="184" text-anchor="middle">STM32 HAL</text>
    <rect x="114" y="168" width="82" height="24" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#2DD4BF" stroke-opacity="0.35"/>
    <text x="155" y="184" text-anchor="middle">FreeRTOS</text>
    <rect x="204" y="168" width="60" height="24" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#2DD4BF" stroke-opacity="0.35"/>
    <text x="234" y="184" text-anchor="middle">UART</text>
    <rect x="272" y="168" width="82" height="24" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#2DD4BF" stroke-opacity="0.35"/>
    <text x="313" y="184" text-anchor="middle">Doxygen</text>
  </g>
</svg>
